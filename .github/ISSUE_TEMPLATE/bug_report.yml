name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先移除日志和截图中的 API Key、Token、Cookie 与私人对话。
  - type: input
    id: plugin-version
    attributes:
      label: dsh-openui 版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本与运行方式
      placeholder: Desktop / Web，版本号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请提供最小、完整的复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附已脱敏的日志、截图或最小 OpenUI Lang 程序。
